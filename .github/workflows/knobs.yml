name: Knobs

on:
  push:
    paths: ['knobs/**', '.github/workflows/knobs.yml']
    tags: ['knobs-v*']
  pull_request:
    paths: ['knobs/**', '.github/workflows/knobs.yml']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release (knobs-v<package.json version>) once the builds pass
        type: boolean
        default: false

# A newer push to the same PR cancels the older run. Release runs are never cancelled.
concurrency:
  group: knobs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: knobs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: knobs/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end tests (real Electron app under Xvfb)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb xdotool
          npx playwright install-deps chromium >/dev/null 2>&1 || true
          xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:e2e

  package:
    needs: test
    # Windows only: Linux builds are no longer published.
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: knobs/package-lock.json
      - run: npm ci

      # Code signing turns on automatically once the WIN_CSC_LINK (base64 .pfx) and
      # WIN_CSC_KEY_PASSWORD repository secrets exist. Without them the build is unsigned.
      - name: Build Windows installer + portable zip
        shell: pwsh
        env:
          SIGN_CERT: ${{ secrets.WIN_CSC_LINK }}
          SIGN_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ($env:SIGN_CERT) { $env:CSC_LINK = $env:SIGN_CERT; $env:CSC_KEY_PASSWORD = $env:SIGN_PASSWORD }
          else { $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false' }
          npm run dist:win

      - name: Install, launch and uninstall on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem release/Knobs-Setup-*.exe | Select-Object -First 1).FullName
          $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\knobs"
          $exe = "$dir\Knobs.exe"
          if (-not (Test-Path $exe)) { throw "Knobs.exe not found in $dir" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Knobs.lnk")) { throw 'Start menu shortcut missing' }

          $env:KNOBS_SMOKE_OUT = "$env:RUNNER_TEMP\knobs-smoke.txt"
          $p = Start-Process $exe -ArgumentList '--smoke-test' -Wait -PassThru
          if (Test-Path $env:KNOBS_SMOKE_OUT) { Get-Content $env:KNOBS_SMOKE_OUT }
          if ($p.ExitCode -ne 0) { throw "installed app failed its smoke test (exit $($p.ExitCode))" }

          Start-Process "$dir\Uninstall Knobs.exe" -ArgumentList '/S' -Wait
          # The NSIS uninstaller re-launches itself from %TEMP%, so wait for the files to go.
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $exe) { throw 'uninstaller left Knobs.exe behind' }
          'install -> launch -> uninstall OK'

      - name: Checksums
        shell: bash
        run: |
          cd release
          sha256sum *.exe *.zip > SHA256SUMS-Windows.txt
          cat SHA256SUMS-Windows.txt

      # Signed record that these files were built by this workflow from this commit.
      # Verify with: gh attestation verify <file> -R Mrperson73/shift-game
      - uses: actions/attest-build-provenance@v2
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          subject-path: |
            knobs/release/Knobs-Setup-*.exe
            knobs/release/Knobs-Portable-*.zip

      # One artifact per download so nothing ends up zipped inside another zip.
      - uses: actions/upload-artifact@v4
        with:
          name: Knobs-Setup-Windows
          path: |
            knobs/release/Knobs-Setup-*.exe
            knobs/release/SHA256SUMS-*.txt
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Knobs-Portable-Windows
          path: knobs/release/Knobs-Portable-*.zip
          compression-level: 0
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/knobs-v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"
          else tag="knobs-v$(node -p "require('./knobs/package.json').version")"; fi
          cat > notes.md <<'EOF'
          **Windows:** download `Knobs-Setup-*.exe` and double-click it. It installs for your user only (no admin prompt), adds Start menu and desktop shortcuts, and opens Knobs when it's done.

          Knobs isn't code-signed, so SmartScreen may say *"Windows protected your PC"*. Click **More info → Run anyway**.

          **Portable:** extract `Knobs-Portable-*.zip` to a folder and run `Knobs.exe` from there.

          Before this release was published, CI installed the Windows build on a clean machine, launched it with `--smoke-test` and uninstalled it. SHA-256 checksums are in `SHA256SUMS-*.txt`. Build provenance: `gh attestation verify <file> -R Mrperson73/shift-game`.
          EOF
          gh release create "$tag" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Knobs ${tag#knobs-v}" \
            --notes-file notes.md
