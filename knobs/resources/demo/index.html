<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Knobs Demo</title>
<style>
  :root {
    --sky-top: #232a52;
    --sky-bottom: #0b0d17;
    --hud: #f5f7ff;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d17; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 16px; left: 20px; color: var(--hud); font: 600 18px system-ui, sans-serif; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); pointer-events: none; }
  #help { position: fixed; bottom: 16px; left: 20px; color: rgba(245, 247, 255, 0.55); font: 13px system-ui, sans-serif; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">Coins: 0</div>
<div id="help">← → or A D to run · Space, W or ↑ to jump · R to restart the level</div>
<script>
// Drag GRAVITY, JUMP_VELOCITY or RUN_SPEED in the Knobs panel while you play.
const GRAVITY = 2200;         // px/s²
const JUMP_VELOCITY = 820;    // px/s
const RUN_SPEED = 360;        // px/s
const ACCELERATION = 3200;
const FRICTION = 0.82;
const AIR_CONTROL = 0.6;
const JUMP_CUT = 0.45;        // share of upward speed kept when you let go of jump early
const COYOTE_TIME = 0.1;      // seconds you can still jump after running off a ledge
const JUMP_BUFFER = 0.12;     // seconds a jump press is remembered before landing
const MAX_FALL_SPEED = 1400;
const SQUASH = 0.28;
const SHAKE_ON_LAND = 7;
const PARTICLES_PER_COIN = 18;
const SHOW_HITBOXES = false;

const COLORS = {
  player: '#ff9a3c',
  eyes: '#1b1f3a',
  platform: '#343c5e',
  platformTop: '#8fa3ff',
  coin: '#ffd84d',
  stars: '#c8d2ff',
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

// [x, y, width, height]; y grows downwards and the ground's top is at 0
const platforms = [
  [-600, 0, 1600, 400], [1150, 0, 900, 400], [2200, 0, 1700, 400],
  [260, -130, 200, 24], [540, -240, 180, 24], [840, -170, 160, 24],
  [1260, -150, 220, 24], [1570, -280, 180, 24], [1900, -200, 160, 24],
  [2360, -140, 200, 24], [2660, -260, 200, 24], [2960, -380, 180, 24], [3300, -210, 240, 24],
];
const stars = Array.from({ length: 140 }, () => ({ x: Math.random() * 4000, y: Math.random() * 700, r: Math.random() * 1.6 + 0.3, depth: Math.random() * 0.6 + 0.1 }));
let coins, particles, score, cam, shake;
const player = { x: 0, y: -60, w: 34, h: 34, vx: 0, vy: 0, onGround: false, coyote: 0, buffer: 0, sx: 1, sy: 1, face: 1 };
const keys = new Set();

function reset() {
  Object.assign(player, { x: 0, y: -60, vx: 0, vy: 0, onGround: false, sx: 1, sy: 1 });
  coins = platforms.slice(3).map(([x, y, w]) => ({ x: x + w / 2, y: y - 40, taken: false }))
    .concat(Array.from({ length: 8 }, (_, i) => ({ x: 150 + i * 430, y: -60, taken: false })));
  particles = [];
  score = 0;
  cam = -W * 0.3;
  shake = 0;
  hud.textContent = `Coins: 0 / ${coins.length}`;
}

const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
addEventListener('keydown', (e) => {
  keys.add(e.code);
  if (JUMP_KEYS.includes(e.code)) { if (!e.repeat) player.buffer = JUMP_BUFFER; e.preventDefault(); }
  if (e.code === 'KeyR') reset();
});
addEventListener('keyup', (e) => {
  keys.delete(e.code);
  if (JUMP_KEYS.includes(e.code) && player.vy < 0) player.vy *= JUMP_CUT;
});
addEventListener('blur', () => keys.clear());

const overlaps = (a, p) => a.x < p[0] + p[2] && a.x + a.w > p[0] && a.y < p[1] + p[3] && a.y + a.h > p[1];

function burst(x, y, n, color, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = speed * (0.4 + Math.random() * 0.6);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - speed * 0.3, life: 0.6 + Math.random() * 0.4, color });
  }
}

function update(dt) {
  const dir = (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0);
  const control = player.onGround ? 1 : AIR_CONTROL;
  if (dir) { player.vx += dir * ACCELERATION * control * dt; player.face = dir; }
  else if (player.onGround) player.vx *= Math.pow(FRICTION, dt * 60);
  player.vx = Math.max(-RUN_SPEED, Math.min(RUN_SPEED, player.vx));
  player.vy = Math.min(MAX_FALL_SPEED, player.vy + GRAVITY * dt);
  player.coyote -= dt;
  player.buffer -= dt;
  if (player.buffer > 0 && (player.onGround || player.coyote > 0)) {
    player.vy = -JUMP_VELOCITY;
    player.buffer = player.coyote = 0;
    player.onGround = false;
    player.sx = 1 - SQUASH; player.sy = 1 + SQUASH;
    burst(player.x + player.w / 2, player.y + player.h, 6, COLORS.platformTop, 120);
  }

  player.x += player.vx * dt;
  for (const p of platforms) if (overlaps(player, p)) {
    player.x = player.vx > 0 ? p[0] - player.w : p[0] + p[2];
    player.vx = 0;
  }
  const wasGrounded = player.onGround, fallSpeed = player.vy;
  player.onGround = false;
  player.y += player.vy * dt;
  for (const p of platforms) if (overlaps(player, p)) {
    if (player.vy > 0) { player.y = p[1] - player.h; player.onGround = true; player.coyote = COYOTE_TIME; }
    else player.y = p[1] + p[3];
    player.vy = 0;
  }
  if (player.onGround && !wasGrounded && fallSpeed > 500) {
    shake = SHAKE_ON_LAND * Math.min(1, fallSpeed / 1200);
    player.sx = 1 + SQUASH; player.sy = 1 - SQUASH;
    burst(player.x + player.w / 2, player.y + player.h, 8, COLORS.platformTop, 160);
  }
  player.sx += (1 - player.sx) * Math.min(1, dt * 12);
  player.sy += (1 - player.sy) * Math.min(1, dt * 12);
  if (player.y > 900) reset();

  for (const c of coins) {
    if (c.taken || Math.abs(c.x - (player.x + player.w / 2)) > 28 || Math.abs(c.y - (player.y + player.h / 2)) > 30) continue;
    c.taken = true;
    score++;
    hud.textContent = score === coins.length ? `All ${score} coins! Press R to play again` : `Coins: ${score} / ${coins.length}`;
    burst(c.x, c.y, PARTICLES_PER_COIN, COLORS.coin, 260);
  }
  for (const p of particles) { p.vy += GRAVITY * 0.5 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  particles = particles.filter((p) => p.life > 0);
  cam += (player.x - W * 0.4 - cam) * Math.min(1, dt * 5);
  shake *= Math.pow(0.002, dt);
}

function draw(t) {
  const css = getComputedStyle(document.documentElement);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, css.getPropertyValue('--sky-top'));
  sky.addColorStop(1, css.getPropertyValue('--sky-bottom'));
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = COLORS.stars;
  for (const s of stars) {
    const x = (((s.x - cam * s.depth) % 4000) + 4000) % 4000;
    if (x > W) continue;
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 2 + s.x);
    ctx.fillRect(x, s.y, s.r * 2, s.r * 2);
  }
  ctx.globalAlpha = 1;

  ctx.save();
  const ox = (Math.random() - 0.5) * shake, oy = (Math.random() - 0.5) * shake;
  ctx.translate(Math.round(-cam + ox), Math.round(H - 90 + oy));
  for (const [x, y, w, h] of platforms) {
    ctx.fillStyle = COLORS.platform;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = COLORS.platformTop;
    ctx.fillRect(x, y, w, 4);
  }
  for (const c of coins) {
    if (c.taken) continue;
    const bob = Math.sin(t * 4 + c.x) * 4;
    ctx.fillStyle = COLORS.coin;
    ctx.beginPath();
    ctx.ellipse(c.x, c.y + bob, 9 * Math.abs(Math.cos(t * 3 + c.x)) + 2, 11, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
  }
  ctx.globalAlpha = 1;

  const w = player.w * player.sx, h = player.h * player.sy;
  const px = player.x + player.w / 2 - w / 2, py = player.y + player.h - h;
  ctx.fillStyle = COLORS.player;
  ctx.beginPath();
  ctx.roundRect(px, py, w, h, 8);
  ctx.fill();
  ctx.fillStyle = COLORS.eyes;
  const ex = px + w / 2 + player.face * 6;
  ctx.fillRect(ex - 7, py + h * 0.3, 5, 8);
  ctx.fillRect(ex + 3, py + h * 0.3, 5, 8);
  if (SHOW_HITBOXES) {
    ctx.strokeStyle = '#ff4d6d';
    ctx.strokeRect(player.x, player.y, player.w, player.h);
    for (const p of platforms) ctx.strokeRect(p[0], p[1], p[2], p[3]);
  }
  ctx.restore();
}

reset();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
